[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llme"
version = "0.1.0"
description = "Cross-Platform Hardware Scanner and AI Model Recommender"
authors = [
    {name = "Charlie Seay"}
]
readme = "HANDOFF.md"
requires-python = ">=3.8"
dependencies = [
    "psutil",
    "requests",
    "jinja2"
]

[project.scripts]
llme = "llme.cli:main"
